<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<title>萬界修仙 V3.0</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>萬界修仙</h1>

<div id="panel">

<h2>角色資訊</h2>

<p>境界：<span id="realm"></span></p>

<p>靈根：<span id="root"></span></p>

<p>修為：<span id="exp"></span></p>

<p>靈石：<span id="gold"></span></p>

<p>戰力：<span id="power"></span></p>

<p>武器：<span id="weapon"></span></p>

</div>

<div id="log"></div>

<div id="bagBox"></div>

<div id="menu">

<button onclick="cultivate()">修煉</button>
<button onclick="explore()">探索</button>
<button onclick="checkRoot()">靈根</button>
<button onclick="saveGame()">存檔</button>

</div>

<script src="game.js"></script>

</body>
</html>
