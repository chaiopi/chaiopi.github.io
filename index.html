<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>從流民到王朝 Alpha 0.1.1</title>

<style>

body{
    margin:0;
    background:#d8e8c8;
    font-family:"Microsoft JhengHei";
}

#topbar{
    background:#3d5a40;
    color:white;
    padding:10px;
    font-size:20px;
}

#game{
    border:2px solid #333;
    display:block;
    margin:auto;
    background:#8fbc8f;
}

</style>

</head>

<body>

<div id="topbar">
🏕️ 從流民到王朝
｜春季
｜第1天
｜06:00
｜人口：3
｜木材：50
｜糧食：50
｜銅錢：500
</div>

<canvas id="game" width="1000" height="600"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const wangbaImg = new Image();
wangbaImg.src = "wangba.png";

const yemaImg = new Image();
yemaImg.src = "yema.png";

const ningerImg = new Image();
ningerImg.src = "ninger.png";

let wood = 50;
let food = 50;
let money = 500;
function updateUI(){

document.getElementById("topbar").innerHTML =
"🏡 從流民到王朝 ｜ 春季 ｜ 第1天 ｜ 06:00 ｜ 人口：3 ｜ 木材：" +
wood +
" ｜ 糧食：" +
food +
" ｜ 銅錢：" +
money;

}
    
const villagers = [

   {
    name:"王爸",
    x:200,
    y:200,
    job:"伐木",
    img:"wangba"
},

 {
    name:"葉媽",
    x:300,
    y:250,
    job:"農耕",
    img:"yema"
},

   {
    name:"甯兒",
    x:400,
    y:300,
    job:"玩耍",
    img:"ninger"
}

];

function draw(){

    ctx.clearRect(0,0,1000,600);

    // 草地
    ctx.fillStyle="#8fbc8f";
    ctx.fillRect(0,0,1000,600);

    // 河流
    ctx.fillStyle="#4da6ff";
    ctx.fillRect(0,450,1000,80);

    // 帳篷
    ctx.fillStyle="#996633";
    ctx.fillRect(500,250,80,60);

    ctx.fillStyle="white";
    ctx.fillText("帳篷",520,240);

    // 農田
    ctx.fillStyle="#d8c15a";
    ctx.fillRect(650,250,100,80);

    ctx.fillStyle="black";
    ctx.fillText("農田",680,240);

    // 樹木
    ctx.fillStyle="darkgreen";

    ctx.beginPath();
    ctx.arc(150,150,20,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(220,120,20,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(120,220,20,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="black";
    ctx.fillText("樹林",120,100);

    villagers.forEach(v=>{

        v.x += (Math.random()-0.5)*1.5;
        v.y += (Math.random()-0.5)*1.5;

        let img;

if(v.img==="wangba"){
    img = wangbaImg;
}

if(v.img==="yema"){
    img = yemaImg;
}

if(v.img==="ninger"){
    img = ningerImg;
}

let size = 64;

if(img){

    ctx.drawImage(
        img,
        v.x - size/2,
        v.y - size/2,
        size,
        size
    );

}
}

        ctx.fillStyle="black";

        ctx.fillText(
    v.name,
    v.x - 15,
    v.y + 55
);

    });

    requestAnimationFrame(draw);
}

setInterval(()=>{

    wood++;

    updateUI();

},5000);

setInterval(()=>{

    food++;

    updateUI();

},7000);

updateUI();
draw();

</script>

</body>
</html>
